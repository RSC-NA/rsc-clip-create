services:
  mysql:
    image: mysql:8.4
    container_name: clip-create-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clip_create
      MYSQL_USER: clip_create
      MYSQL_PASSWORD: clip_create
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
