services:
  mysql:
    image: mysql:8.4
    container_name: clip-create-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clip_create
      MYSQL_USER: clip_create
      MYSQL_PASSWORD: clip_create
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
