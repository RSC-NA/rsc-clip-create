[tool.pytest.ini_options]
# Lets `pytest` run from the repo root without PYTHONPATH=. every time.
pythonpath = ["."]
testpaths = ["backend/tests"]
# Integration tests shell out to ffmpeg and take ~30s; opt in with
#   pytest -m integration      (or -m "" for everything)
addopts = "-q --strict-markers -m 'not integration'"
markers = [
    "integration: exercises real ffmpeg; skipped when ffmpeg is unavailable",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", ".next", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["B011"]
