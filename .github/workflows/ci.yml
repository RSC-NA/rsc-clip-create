name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest

  # Real renders, run inside the API image so they use the ffmpeg production ships.
  # Frame counts differ between ffmpeg versions (Ubuntu's 6.1 drops a frame per clip).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: clip-create-api:ci
          cache-from: type=gha,scope=api
      - run: >
          docker run --rm -v "$PWD/pyproject.toml:/app/pyproject.toml:ro" clip-create-api:ci
          python -m pytest -m integration -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # The whole stack in Docker: upload, render, download. Not a merge gate; it is slow.
  docker-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend, integration]
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg
      - run: docker compose up -d --build
      - run: ./scripts/docker-smoke.sh
      - if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
